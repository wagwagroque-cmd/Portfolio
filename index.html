<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typing Game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #e0f7fa;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #00796b;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-bottom: 15px;
    }

    li {
      font-size: 18px;
      margin: 4px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .checkmark {
      color: green;
      font-size: 20px;
    }

    .xmark {
      color: red;
      font-size: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 10px;
      border: 2px solid #b2dfdb;
      border-radius: 6px;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      margin: 5px;
      background-color: #00796b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #004d40;
    }

    .slide {
      display: none;
    }

    .active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Slide 1: Word Entry -->
    <div id="slide1" class="slide active">
      <h2>Enter Words</h2>
      <ul id="wordList"></ul>
      <input type="text" id="newWordInput" placeholder="Add a word..." />
      <button onclick="addWord()">Add Word</button>
      <br>
      <button onclick="startGame()">Start</button>
    </div>

    <!-- Slide 2: Typing Game -->
    <div id="slide2" class="slide">
      <h2>Type the Words</h2>
      <ul id="typingList"></ul>
      <input type="text" id="typingInput" placeholder="Type here..." />
      <br>
      <button onclick="checkWord()">Enter</button>
      <button onclick="clearInput()">Clear</button>
    </div>
  </div>

  <script>
    const wordList = [];
    const wordListElement = document.getElementById("wordList");
    const typingListElement = document.getElementById("typingList");
    const newWordInput = document.getElementById("newWordInput");
    const typingInput = document.getElementById("typingInput");

    function addWord() {
      const word = newWordInput.value.trim();
      if (word) {
        wordList.push({ word, status: null }); // status: null, 'correct', 'wrong'
        updateWordList();
        newWordInput.value = "";
        newWordInput.focus();
      }
    }

    function updateWordList() {
      wordListElement.innerHTML = "";
      wordList.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item.word;
        wordListElement.appendChild(li);
      });
    }

    function startGame() {
      if (wordList.length === 0) {
        alert("Please add some words first.");
        return;
      }
      document.getElementById("slide1").classList.remove("active");
      document.getElementById("slide2").classList.add("active");
      updateTypingList();
      typingInput.focus();
    }

    function updateTypingList() {
      typingListElement.innerHTML = "";
      wordList.forEach((item, index) => {
        const li = document.createElement("li");
        li.id = "word-" + index;

        let icon = '';
        if (item.status === 'correct') {
          icon = '<span class="checkmark">✅</span>';
        } else if (item.status === 'wrong') {
          icon = '<span class="xmark">❌</span>';
        }

        li.innerHTML = `<span>${item.word}</span> ${icon}`;
        typingListElement.appendChild(li);
      });
    }

    function checkWord() {
      const typed = typingInput.value.trim();
      const matchIndex = wordList.findIndex(item => item.word === typed && item.status === null);

      if (matchIndex > -1) {
        wordList[matchIndex].status = 'correct';
      } else {
        // Find the first unattempted word and mark it wrong
        const firstUnattempted = wordList.find(item => item.status === null);
        if (firstUnattempted) {
          firstUnattempted.status = 'wrong';
        } else {
          alert("All words already attempted.");
        }
      }

      typingInput.value = "";
      updateTypingList();
    }

    function clearInput() {
      typingInput.value = "";
      newWordInput.value = "";
      wordList.length = 0;
      wordListElement.innerHTML = "";
      typingListElement.innerHTML = "";

      document.getElementById("slide2").classList.remove("active");
      document.getElementById("slide1").classList.add("active");
      newWordInput.focus();
    }
  </script>
</body>
</html>
